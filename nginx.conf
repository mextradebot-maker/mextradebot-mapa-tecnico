server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Acceso con usuario y clave (el archivo lo genera docker-entrypoint.sh)
    auth_basic "MexTradeBot - mapa tecnico";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # No indexar, no incrustar, no filtrar el origen
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Chequeo de salud para EasyPanel (no expone contenido)
    location = /health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Sin listado de carpetas ni archivos ocultos
    autoindex off;
    location ~ /\. {
        deny all;
    }
}
